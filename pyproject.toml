[project]
name = "vap"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "black>=26.5.1",
    "docker>=7.2.0",
    "openai>=2.0.0",
    "pydantic>=2.13.4",
    "requests>=2.34.2",
    "torch-tb-profiler>=0.4.3",
]

[tool.setuptools]
py-modules = ["agent_runtime", "cli", "config", "main", "runtime_paths", "server", "trace_fusion", "validation"]

[dependency-groups]
docs = [
    "mkdocs-gen-files>=0.6.1",
    "mkdocs-material>=9.7.7",
]

[project.scripts]
vap = "cli:main"
