[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "vap"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "docker[ssh]>=7.2.0",
    "openai>=2.0.0",
    "pydantic>=2.13.4",
    "requests>=2.34.2",
    "torch-tb-profiler>=0.4.3",
]

[tool.setuptools.packages.find]
include = ["vap*"]

[tool.setuptools.data-files]
"share/vap" = ["example-config.json", "uninstall.sh"]
"share/vap/public" = ["public/index.html", "public/favicon.svg"]
"share/vap/skills/TorchProfilerTraceSkill" = [
    "skills/TorchProfilerTraceSkill/LICENSE",
    "skills/TorchProfilerTraceSkill/NOTICE.md",
    "skills/TorchProfilerTraceSkill/README.md",
    "skills/TorchProfilerTraceSkill/SKILL.md",
    "skills/TorchProfilerTraceSkill/WORKFLOWS.md",
    "skills/TorchProfilerTraceSkill/queries.yaml",
    "skills/TorchProfilerTraceSkill/runner.py",
]

[dependency-groups]
dev = [
    "black>=26.5.1",
    "isort>=8.0.1",
]
docs = [
    "mkdocs-gen-files>=0.6.1",
    "mkdocs-material>=9.7.7",
]

[project.scripts]
vap = "vap.cli:main"

[tool.black]
target-version = ["py312"]

[tool.isort]
profile = "black"
src_paths = ["vap", "tests"]
known_first_party = ["vap"]
