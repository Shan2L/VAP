    <text x="421" y="72" fill="#475569">Reload</text>
    <rect x="460" y="51" width="76" height="34" rx="9" fill="#FFFFFF" stroke="#D6E0EC"/>
    <text x="498" y="72" fill="#475569">Validate</text>
    <rect x="544" y="51" width="82" height="34" rx="9" fill="#FFFFFF" stroke="#D6E0EC"/>
    <text x="585" y="72" fill="#475569">Config </text>
    <rect x="634" y="51" width="58" height="34" rx="9" fill="#2563EB"/>
    <text x="663" y="72" fill="#FFFFFF">Run</text>
    <rect x="700" y="51" width="58" height="34" rx="9" fill="#FFF1F2" stroke="#FECDD3"/>
    <text x="729" y="72" fill="#BE123C">Stop</text>
    <rect x="766" y="51" width="88" height="34" rx="9" fill="#FFFFFF" stroke="#D6E0EC"/>
    <text x="810" y="72" fill="#475569">TensorBoard</text>
    <rect x="862" y="51" width="72" height="34" rx="9" fill="#FFFFFF" stroke="#D6E0EC"/>
