  <rect x="112" y="558" width="610" height="64" rx="10" fill="#EFF6FF" stroke="#BFDBFE"/>
  <circle cx="138" cy="590" r="7" fill="#2563EB"/>
  <text x="155" y="586" font-family="Inter, Arial, sans-serif" font-size="10" font-weight="800" fill="#1E3A5F">Unsaved browser draft</text>
  <text x="155" y="603" font-family="Inter, Arial, sans-serif" font-size="9" fill="#64748B">Edits are restored only while the source revision matches.</text>

  <rect x="748" y="118" width="10" height="526" rx="5" fill="#D8E3F0"/>
  <rect x="751" y="310" width="4" height="116" rx="2" fill="#94A3B8"/>

  <rect x="768" y="118" width="398" height="526" rx="14" fill="#FBFDFF" stroke="#DCE5F0"/>
  <rect x="784" y="134" width="366" height="248" rx="12" fill="#FFFFFF" stroke="#93C5FD" stroke-width="2"/>
