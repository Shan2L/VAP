  <text x="58" y="76" font-family="Inter, Arial, sans-serif" font-size="25" font-weight="800" fill="#172033">VAP</text>
  <circle cx="110" cy="68" r="5" fill="#22C55E"/>
  <text x="122" y="73" font-family="Inter, Arial, sans-serif" font-size="11" font-weight="700" fill="#64748B">CONNECTED</text>

  <g font-family="Inter, Arial, sans-serif" font-size="10" font-weight="700" text-anchor="middle">
