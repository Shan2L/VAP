    <rect x="112" y="382" width="610" height="46" rx="10" fill="#FFFFFF" stroke="#DCE5F0"/>
    <text x="132" y="410">vLLM Deploy Config</text>
    <text x="692" y="410" text-anchor="end" fill="#94A3B8">:</text>
    <rect x="112" y="438" width="610" height="46" rx="10" fill="#FFFFFF" stroke="#DCE5F0"/>
    <text x="132" y="466">Profiler Config</text>
    <text x="692" y="466" text-anchor="end" fill="#94A3B8">:</text>
    <rect x="112" y="494" width="610" height="46" rx="10" fill="#FFFFFF" stroke="#DCE5F0"/>
    <text x="132" y="522">Benchmark Config</text>
    <text x="692" y="522" text-anchor="end" fill="#94A3B8">:</text>
