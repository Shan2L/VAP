    <path d="M804 216H1084"/>
    <path d="M804 238H1124"/>
    <path d="M804 260H1054"/>
    <path d="M804 282H1100"/>
    <path d="M804 304H1070"/>
    <path d="M804 326H1118"/>
    <path d="M804 348H1016"/>
  </g>

  <rect x="784" y="394" width="366" height="78" rx="11" fill="#FFFFFF" stroke="#DCE5F0"/>
  <text x="804" y="426" font-family="Inter, Arial, sans-serif" font-size="11" font-weight="800" fill="#475569">vLLM Deploy Log</text>
  <text x="1128" y="426" text-anchor="end" font-family="Inter, Arial, sans-serif" font-size="9" fill="#64748B">Copy / Download</text>
  <path d="M804 447H1086" stroke="#D8E1EC" stroke-width="3" stroke-linecap="round"/>

  <rect x="784" y="484" width="366" height="78" rx="11" fill="#FFFFFF" stroke="#DCE5F0"/>
  <text x="804" y="516" font-family="Inter, Arial, sans-serif" font-size="11" font-weight="800" fill="#475569">vLLM Benchmark Log</text>
  <text x="1128" y="516" text-anchor="end" font-family="Inter, Arial, sans-serif" font-size="9" fill="#64748B">Copy / Download</text>
  <path d="M804 537H1068" stroke="#D8E1EC" stroke-width="3" stroke-linecap="round"/>

  <rect x="784" y="576" width="366" height="48" rx="10" fill="#F8FAFC" stroke="#DCE5F0"/>
  <text x="804" y="605" font-family="Inter, Arial, sans-serif" font-size="10" font-weight="700" fill="#64748B">Logs, status, and run evidence</text>

