  <rect x="42" y="232" width="46" height="82" rx="10" fill="#FFFFFF" stroke="#D6E0EC"/>
  <text x="65" y="274" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="10" font-weight="800" fill="#64748B" transform="rotate(-90 65 274)">AGENT</text>

  <text x="120" y="153" font-family="Inter, Arial, sans-serif" font-size="13" font-weight="800" fill="#334155">Configuration workspace</text>

