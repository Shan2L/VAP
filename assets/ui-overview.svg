<svg width="1200" height="680" viewBox="0 0 1200 680" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
  <title id="title">Annotated VAP Web UI layout</title>
  <desc id="desc">A light wireframe showing the VAP toolbar, workspace tabs, configuration panels, splitter, status, and log panels.</desc>

  <rect width="1200" height="680" rx="24" fill="#F4F7FB"/>
  <rect x="18" y="18" width="1164" height="644" rx="18" fill="#FFFFFF" stroke="#CBD8E8" stroke-width="2"/>

